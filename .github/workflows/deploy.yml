name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyD8G_pVnqoZ7j68oQlCzSXLgBJAvnPotJ4
          VITE_FIREBASE_AUTH_DOMAIN: quantumcyberfortress.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: quantumcyberfortress
          VITE_FIREBASE_STORAGE_BUCKET: quantumcyberfortress.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "98091858395"
          VITE_FIREBASE_APP_ID: 1:98091858395:web:ae5130803398ceac8d8ffe
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
